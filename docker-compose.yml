services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: currency_user
      POSTGRES_PASSWORD: currency_password
      POSTGRES_DB: currency_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U currency_user -d currency_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      POSTGRES_USER: currency_user
      POSTGRES_PASSWORD: currency_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: currency_db
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
